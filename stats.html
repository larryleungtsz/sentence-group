<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>練習統計</title>
  <link rel="stylesheet" href="css/app.css?v=20261102sync" />
</head>
<body>
  <div class="wrap">
    <header>
      <a class="nav-back" href="index.html">← 首頁</a>
      <h1>練習統計</h1>
    </header>
    <div id="sync-panel"></div>
    <p class="muted">未登入雲端時，記錄只喺本機（localStorage），唔會寫入 Notion。時間顯示為 Asia/Hong_Kong。手機備份用上面「匯出 JSON／匯入 JSON」合併，空白唔會覆蓋。</p>
    <div class="toolbar">
      <button type="button" id="clear-timing" class="btn btn-ghost">清除計時記錄</button>
    </div>
    <p id="stats-empty" class="muted" hidden>未有練習記錄。做完一個 session 就會出現喺度。</p>
    <div id="session-list"></div>
    <div id="session-detail" class="stats-detail" hidden></div>
  </div>
  <script src="js/sync-config.js?v=20261102sync"></script>
  <script src="js/sync-merge.js?v=20261102sync"></script>
  <script src="js/schedule.js"></script>
  <script src="js/timing.js?v=20261102sync"></script>
  <script src="js/progress.js?v=20261102sync"></script>
  <script src="js/sync.js?v=20261102sync"></script>
  <script src="js/stats.js?v=20261102sync"></script>
</body>
</html>
